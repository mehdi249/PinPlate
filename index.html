<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>PinPlate</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f9f6f1;
      --surface: #ffffff;
      --primary: #d94f3d;
      --text: #1a1a1a;
      --muted: #888;
      --border: #e5e0d8;
      --radius: 14px;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    #header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #header h1 { font-size: 1.2rem; font-weight: 700; letter-spacing: -0.3px; }
    #header h1 span { color: var(--primary); }
    #btn-add {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 8px 18px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* ── Filter bar ── */
    #filter-bar {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    #filter-bar::-webkit-scrollbar { display: none; }
    .filter-chip {
      flex-shrink: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 6px 14px;
      font-size: 0.82rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .filter-chip.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* ── List ── */
    #list {
      flex: 1;
      padding: 0 16px 100px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 14px 16px;
      border: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .card-emoji { font-size: 1.8rem; flex-shrink: 0; }
    .card-body { flex: 1; min-width: 0; }
    .card-name {
      font-size: 1rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-meta { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
    .card-badge {
      flex-shrink: 0;
      font-size: 0.72rem;
      padding: 3px 10px;
      border-radius: 50px;
      background: #eef;
      color: var(--muted);
    }
    .card-badge.visited {
      background: #e8f5e9;
      color: #2e7d32;
    }

    /* ── Empty state ── */
    #empty {
      display: none;
      text-align: center;
      padding: 60px 24px;
      color: var(--muted);
    }
    #empty p { font-size: 1rem; margin-top: 8px; }

    /* ── Modal ── */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 100;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--surface);
      border-radius: var(--radius) var(--radius) 0 0;
      width: 100%;
      max-width: 540px;
      max-height: 90dvh;
      overflow-y: auto;
      padding: 24px 20px 40px;
    }
    .modal h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 20px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 5px; font-weight: 500; }
    .field input, .field select, .field textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.95rem;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      outline: none;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--primary);
    }
    .field textarea { resize: vertical; min-height: 72px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .btn-primary {
      flex: 1;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 13px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-secondary {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 13px 18px;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .btn-danger {
      background: #fff0ee;
      color: var(--primary);
      border: 1px solid #ffd0ca;
      border-radius: 10px;
      padding: 13px 18px;
      font-size: 0.95rem;
      cursor: pointer;
    }

    /* ── Detail modal extras ── */
    .detail-name { font-size: 1.3rem; font-weight: 700; margin-bottom: 4px; }
    .detail-meta { font-size: 0.85rem; color: var(--muted); margin-bottom: 16px; }
    .detail-row { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 10px; font-size: 0.9rem; }
    .detail-row-label { color: var(--muted); min-width: 110px; font-size: 0.82rem; padding-top: 1px; }
    .stars { font-size: 1.2rem; letter-spacing: 2px; }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1a1a1a;
      color: #fff;
      padding: 10px 20px;
      border-radius: 50px;
      font-size: 0.88rem;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 200;
      pointer-events: none;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <div id="header">
    <h1>Pin<span>Plate</span></h1>
    <button id="btn-add" onclick="openAdd()">+ Add</button>
  </div>

  <div id="filter-bar">
    <div class="filter-chip active" data-filter="all" onclick="setFilter('all', this)">All</div>
    <div class="filter-chip" data-filter="unvisited" onclick="setFilter('unvisited', this)">Want to go</div>
    <div class="filter-chip" data-filter="visited" onclick="setFilter('visited', this)">Been there</div>
  </div>

  <div id="list"></div>
  <div id="empty"><div style="font-size:2.5rem">📍</div><p>No spots yet.<br>Add your first recommendation!</p></div>

  <!-- Add / Edit Modal -->
  <div class="modal-backdrop" id="add-modal">
    <div class="modal">
      <h2 id="add-modal-title">Pin a spot</h2>
      <input type="hidden" id="edit-id">
      <div class="field"><label>Restaurant name *</label><input id="f-name" placeholder="e.g. Sushi Nakazawa" /></div>
      <div class="field"><label>Cuisine</label><input id="f-cuisine" placeholder="e.g. Japanese, Italian…" /></div>
      <div class="field"><label>Neighbourhood / City</label><input id="f-location" placeholder="e.g. West Village, NYC" /></div>
      <div class="field"><label>Recommended by</label><input id="f-rec-by" placeholder="e.g. Sarah" /></div>
      <div class="field"><label>Notes</label><textarea id="f-notes" placeholder="Any details — must-orders, vibe, price range…"></textarea></div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeAdd()">Cancel</button>
        <button class="btn-primary" onclick="saveSpot()">Save</button>
      </div>
    </div>
  </div>

  <!-- Detail Modal -->
  <div class="modal-backdrop" id="detail-modal">
    <div class="modal" id="detail-content"></div>
  </div>

  <div id="toast"></div>

<script>
  // ── Supabase ──────────────────────────────────────────────────
  const SUPABASE_URL = 'YOUR_SUPABASE_URL';
  const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const CUISINE_EMOJI = {
    japanese: '🍣', italian: '🍝', mexican: '🌮', french: '🥐',
    chinese: '🥢', indian: '🍛', american: '🍔', thai: '🍜',
    mediterranean: '🫒', korean: '🥩', greek: '🥗', default: '📍'
  };

  function cuisineEmoji(c) {
    if (!c) return CUISINE_EMOJI.default;
    const key = c.toLowerCase().trim();
    const match = Object.keys(CUISINE_EMOJI).find(k => key.includes(k));
    return match ? CUISINE_EMOJI[match] : CUISINE_EMOJI.default;
  }

  // ── State ─────────────────────────────────────────────────────
  let spots = [];
  let activeFilter = 'all';
  let detailId = null;

  // ── Fetch ─────────────────────────────────────────────────────
  async function fetchSpots() {
    const { data, error } = await sb.from('spots').select('*').order('created_at', { ascending: false });
    if (error) { toast('Failed to load spots'); return; }
    spots = data || [];
    render();
  }

  // ── Render ────────────────────────────────────────────────────
  function render() {
    const list = document.getElementById('list');
    const empty = document.getElementById('empty');
    const filtered = spots.filter(s => {
      if (activeFilter === 'visited') return s.visited;
      if (activeFilter === 'unvisited') return !s.visited;
      return true;
    });
    if (!filtered.length) {
      list.innerHTML = '';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';
    list.innerHTML = filtered.map(s => `
      <div class="card" onclick="openDetail('${s.id}')">
        <div class="card-emoji">${cuisineEmoji(s.cuisine)}</div>
        <div class="card-body">
          <div class="card-name">${esc(s.name)}</div>
          <div class="card-meta">${[s.location, s.recommended_by ? '👤 ' + esc(s.recommended_by) : ''].filter(Boolean).join(' · ')}</div>
        </div>
        <div class="card-badge ${s.visited ? 'visited' : ''}">${s.visited ? 'Been ✓' : 'Want to go'}</div>
      </div>
    `).join('');
  }

  function setFilter(f, el) {
    activeFilter = f;
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    render();
  }

  // ── Add / Edit ────────────────────────────────────────────────
  function openAdd(spot) {
    document.getElementById('add-modal-title').textContent = spot ? 'Edit spot' : 'Pin a spot';
    document.getElementById('edit-id').value = spot ? spot.id : '';
    document.getElementById('f-name').value = spot ? spot.name : '';
    document.getElementById('f-cuisine').value = spot ? (spot.cuisine || '') : '';
    document.getElementById('f-location').value = spot ? (spot.location || '') : '';
    document.getElementById('f-rec-by').value = spot ? (spot.recommended_by || '') : '';
    document.getElementById('f-notes').value = spot ? (spot.notes || '') : '';
    document.getElementById('add-modal').classList.add('open');
  }

  function closeAdd() { document.getElementById('add-modal').classList.remove('open'); }

  async function saveSpot() {
    const name = document.getElementById('f-name').value.trim();
    if (!name) { toast('Name is required'); return; }
    const id = document.getElementById('edit-id').value;
    const payload = {
      name,
      cuisine: document.getElementById('f-cuisine').value.trim() || null,
      location: document.getElementById('f-location').value.trim() || null,
      recommended_by: document.getElementById('f-rec-by').value.trim() || null,
      notes: document.getElementById('f-notes').value.trim() || null,
    };
    let error;
    if (id) {
      ({ error } = await sb.from('spots').update(payload).eq('id', id));
    } else {
      payload.visited = false;
      ({ error } = await sb.from('spots').insert(payload));
    }
    if (error) { toast('Save failed: ' + error.message); return; }
    closeAdd();
    closeDetail();
    toast(id ? 'Updated!' : 'Pinned!');
    await fetchSpots();
  }

  // ── Detail ────────────────────────────────────────────────────
  function openDetail(id) {
    detailId = id;
    const s = spots.find(x => x.id === id);
    if (!s) return;
    const stars = s.rating ? '★'.repeat(s.rating) + '☆'.repeat(5 - s.rating) : null;
    document.getElementById('detail-content').innerHTML = `
      <div style="font-size:2.5rem;margin-bottom:10px">${cuisineEmoji(s.cuisine)}</div>
      <div class="detail-name">${esc(s.name)}</div>
      <div class="detail-meta">${[s.cuisine, s.location].filter(Boolean).map(esc).join(' · ')}</div>
      ${s.recommended_by ? `<div class="detail-row"><span class="detail-row-label">Recommended by</span><span>${esc(s.recommended_by)}</span></div>` : ''}
      ${s.notes ? `<div class="detail-row"><span class="detail-row-label">Notes</span><span>${esc(s.notes)}</span></div>` : ''}
      ${stars ? `<div class="detail-row"><span class="detail-row-label">Rating</span><span class="stars">${stars}</span></div>` : ''}
      <div style="margin-top:20px;display:flex;gap:8px;flex-wrap:wrap">
        ${[1,2,3,4,5].map(n => `<button class="btn-secondary" style="flex:1;padding:10px 4px;font-size:1rem" onclick="rateSpot(${n})">★${n}</button>`).join('')}
      </div>
      <div class="modal-actions" style="margin-top:12px">
        <button class="btn-danger" onclick="deleteSpot()">Delete</button>
        <button class="btn-secondary" onclick="openAdd(spots.find(x=>x.id==='${id}'))">Edit</button>
        <button class="btn-primary" onclick="toggleVisited()">${s.visited ? 'Mark unvisited' : 'Mark visited ✓'}</button>
      </div>
      <button class="btn-secondary" style="width:100%;margin-top:10px" onclick="closeDetail()">Close</button>
    `;
    document.getElementById('detail-modal').classList.add('open');
  }

  function closeDetail() { document.getElementById('detail-modal').classList.remove('open'); }

  async function toggleVisited() {
    const s = spots.find(x => x.id === detailId);
    const { error } = await sb.from('spots').update({ visited: !s.visited }).eq('id', detailId);
    if (error) { toast('Update failed'); return; }
    toast(s.visited ? 'Marked as want-to-go' : 'Marked as visited!');
    await fetchSpots();
    openDetail(detailId);
  }

  async function rateSpot(n) {
    const { error } = await sb.from('spots').update({ rating: n }).eq('id', detailId);
    if (error) { toast('Rating failed'); return; }
    toast('Rated ' + '★'.repeat(n));
    await fetchSpots();
    openDetail(detailId);
  }

  async function deleteSpot() {
    if (!confirm('Delete this spot?')) return;
    const { error } = await sb.from('spots').delete().eq('id', detailId);
    if (error) { toast('Delete failed'); return; }
    closeDetail();
    toast('Deleted');
    await fetchSpots();
  }

  // ── Utils ─────────────────────────────────────────────────────
  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  let toastTimer;
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
  }

  // Close modals on backdrop click
  document.querySelectorAll('.modal-backdrop').forEach(el => {
    el.addEventListener('click', e => { if (e.target === el) el.classList.remove('open'); });
  });

  // ── Init ──────────────────────────────────────────────────────
  fetchSpots();
</script>
</body>
</html>
